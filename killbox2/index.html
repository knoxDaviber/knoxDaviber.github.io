<!doctype html>
<html><head><meta charset="utf-8"><title>KILLBOX 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; margin: auto; background: #1b1d24; cursor: crosshair; }
  #ui { position: fixed; color: #efe9dd; font-family: "Segoe UI", Arial, sans-serif; cursor: default; display: flex; align-items: center; justify-content: center; user-select: none; overflow: hidden; }
  #ui[hidden] { display: none; }
  #ui.dim { background: rgba(11,10,15,.62); }
  #ui button { font: inherit; font-weight: 700; color: #efe9dd; background: #17151c; border: .12em solid #4a3a36; padding: .5em 1em; cursor: pointer; }
  #ui button:hover, #ui button:focus-visible { border-color: #ff6a1a; background: #2b2326; outline: none; }
  #ui button.primary { background: #d81b3c; border-color: #d81b3c; color: #fff; }
  #ui button.primary:hover, #ui button.primary:focus-visible { background: #f02a4c; border-color: #efe9dd; }
  #ui button.warn { border-color: #d81b3c; color: #ff9aaa; }
  .home { position: absolute; left: 7%; top: 16%; width: 40%; }
  .home h1 { margin: 0 0 .35em; font: italic 900 4.6em/1 Impact, "Arial Black", sans-serif; letter-spacing: .02em; color: #efe9dd; text-shadow: .05em .05em 0 #0b0a0f; white-space: nowrap; }
  .home h1 b { color: #d81b3c; margin-left: .18em; font-weight: 900; }
  .stack { display: flex; flex-direction: column; gap: .55em; width: 15em; }
  .stack button { text-align: left; font-size: 1.15em; }
  .panel { background: #0f0e13f2; border: .14em solid #4a3a36; border-left: .4em solid #d81b3c; padding: 1.3em 1.7em; box-sizing: border-box; max-height: 94%; display: flex; flex-direction: column; }
  .panel.wide { width: 36em; height: 92%; }
  .panel h2 { margin: 0 0 .55em; font: italic 900 2.1em/1 Impact, "Arial Black", sans-serif; letter-spacing: .03em; }
  .panel h2.lose { color: #d81b3c; } .panel h2.win { color: #ffb02e; }
  .panel h3 { margin: .85em 0 .25em; font-size: .78em; letter-spacing: .12em; text-transform: uppercase; color: #ff9a55; }
  .panel > button.primary { align-self: flex-start; margin-top: .75em; }
  .tabs { display: flex; gap: .35em; margin-bottom: .5em; } .tabs .active { border-color: #ff6a1a !important; background: #2b2326 !important; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: .5em; scrollbar-color: #4a3a36 #17151c; scrollbar-width: thin; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .22em 0; font-size: .92em; }
  .ctl { display: flex; align-items: center; gap: .6em; }
  .ctl input { width: 11em; accent-color: #d81b3c; } .val { width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
  .tog { min-width: 5.5em; padding: .25em .7em !important; } .tog.on { border-color: #ff6a1a !important; }
  .binds { display: grid; grid-template-columns: 1fr 8.5em 8.5em; gap: .28em .5em; align-items: center; font-size: .88em; }
  .binds .head { font-size: .78em; letter-spacing: .1em; text-transform: uppercase; color: #ff9a55; }
  .bind { padding: .2em .4em !important; font-weight: 600 !important; } .bind.wait { border-color: #efe9dd !important; background: #4a3a36 !important; }
  .note { color: #b9b0a4; font-size: .8em; margin: .6em 0; }
</style></head>
<body><canvas id="c" width="960" height="540"></canvas><div id="ui" hidden></div>
<script src="sim.js"></script>
<script src="assets/out/arena.js"></script>
<script src="assets/out/mobs.js"></script>
<script src="assets/out/boss.js"></script>
<script src="ui.js"></script>
<script src="fx.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let RS = 1; // render scale: draw at display resolution (max 2x = 1080p) so inked sprites stay sharp
function fit() { const k = Math.min(innerWidth / KB.W, innerHeight / KB.H); RS = Math.max(1, Math.min(cfg.quality === 'high' ? 2 : 1, k * (devicePixelRatio || 1))); cv.width = Math.round(KB.W * RS); cv.height = Math.round(KB.H * RS); cv.style.width = KB.W * k + 'px'; cv.style.height = KB.H * k + 'px'; cv.style.marginTop = (innerHeight - KB.H * k) / 2 + 'px'; uiFit(k, (innerHeight - KB.H * k) / 2, (innerWidth - KB.W * k) / 2); dirty = true; }
addEventListener('resize', fit); fit();

// --- input (sampled once per tick into a plain object: that object is what goes over the wire later)
const keys = {}, mouse = { x: 480, y: 270 };
addEventListener('keydown', e => { audio(); if (uiKey(e)) return; keys[e.code] = true; });
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * KB.W / r.width; mouse.y = (e.clientY - r.top) * KB.H / r.height; });
cv.addEventListener('mousedown', e => { audio(); if (mode === 'play') keys['Mouse' + e.button] = true; });
addEventListener('mouseup', e => { keys['Mouse' + e.button] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
let wheel = false; cv.addEventListener('wheel', e => { if (mode === 'play') wheel = true; e.preventDefault(); }, { passive: false });
// --- camera: close follow (metroidvania framing), leans toward the aim, wider in the boss fight, clamped to the arena.
const ZOOM = 1.75, ZOOM_BOSS = 1.4, LOOK = 70;
const cam = { x: KB.W / 2, y: KB.H / 2, z: ZOOM };
const toWorldX = sx => cam.x + (sx - KB.W / 2) / cam.z, toWorldY = sy => cam.y + (sy - KB.H / 2) / cam.z;
const toScreen = (x, y) => [(x - cam.x) * cam.z + KB.W / 2, (y - cam.y) * cam.z + KB.H / 2];
function updateCam() {
  const p = s.players[0], boss = s.enemies.some(e => e.type === 'boss');
  cam.z += ((boss ? ZOOM_BOSS : ZOOM) - cam.z) * 0.05;
  const tx = p.x + p.w / 2 + Math.cos(p.aim) * LOOK, ty = p.y + p.h / 2 - 30 + Math.sin(p.aim) * LOOK * 0.6;
  cam.x += (tx - cam.x) * 0.12; cam.y += (ty - cam.y) * 0.12;
  const hw = KB.W / 2 / cam.z, hh = KB.H / 2 / cam.z;
  cam.x = Math.max(hw, Math.min(KB.W - hw, cam.x)); cam.y = Math.max(hh, Math.min(KB.H - hh, cam.y));
}
function offscreenArrows() { // threats outside the view get an arrow on the screen edge
  const M = 22, things = [...s.enemies.map(e => [e.x + e.w / 2, e.y + e.h / 2, COL[e.type]]), ...s.bombs.map(k => [k.x + 10, k.y + 10, '#ff9f43'])];
  for (const [x, y, col] of things) {
    const [sx, sy] = toScreen(x, y);
    if (sx > 0 && sx < KB.W && sy > 0 && sy < KB.H) continue;
    const ex = Math.max(M, Math.min(KB.W - M, sx)), ey = Math.max(M, Math.min(KB.H - M, sy)), a = Math.atan2(sy - ey, sx - ex);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
}
function readInput(p) {
  const inp = { left: actionHeld('left'), right: actionHeld('right'), jump: actionHeld('jump'), down: actionHeld('down'),
    shoot: actionHeld('shoot'), parry: actionHeld('parry'), dodge: actionHeld('dodge'), swap: actionHeld('swap') || wheel, execute: actionHeld('execute'),
    aim: Math.atan2(toWorldY(mouse.y) - (p.y + KB.SHOULDER), toWorldX(mouse.x) - (p.x + p.w / 2)) };
  wheel = false; return inp;
}

// --- audio: tiny synth blips so every action has a sound
let ac = null;
let masterGain = null;
function audio() { if (!ac) { ac = new AudioContext(); masterGain = ac.createGain(); masterGain.connect(ac.destination); applyVolume(); } if (ac.state === 'suspended') ac.resume(); }
function applyVolume() { if (masterGain) masterGain.gain.value = cfg.muted ? 0 : (cfg.volume / 100) ** 1.6; }
function blip(f0, f1, dur, type, vol, noise) {
  if (!ac) return;
  const t = ac.currentTime, g = ac.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); g.connect(masterGain);
  let src;
  if (noise) {
    const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    src = ac.createBufferSource(); src.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    src.connect(f); f.connect(g);
  } else {
    src = ac.createOscillator(); src.type = type; src.frequency.setValueAtTime(f0, t); src.frequency.exponentialRampToValueAtTime(f1, t + dur); src.connect(g);
  }
  src.start(t); src.stop(t + dur);
}
const SFX = {
  shot: e => e.gun === 'shotgun' ? blip(3000, 200, 0.25, '', 0.5, true) : e.gun === 'smg' ? blip(2500, 400, 0.06, '', 0.25, true) : blip(1800, 300, 0.1, '', 0.35, true),
  eshot: () => blip(600, 300, 0.12, 'square', 0.08),
  hit: e => blip(e.kind === 'boss' ? 180 : 400, 80, 0.06, 'square', 0.12),
  die: e => blip(1200, 60, e.kind === 'boss' ? 1.2 : 0.3, '', 0.5, true),
  hurt: () => blip(200, 50, 0.2, 'sawtooth', 0.3),
  jump: () => blip(300, 600, 0.08, 'triangle', 0.15),
  pickup: () => { blip(660, 990, 0.08, 'square', 0.12); setTimeout(() => blip(990, 1320, 0.1, 'square', 0.12), 70); },
  swap: () => blip(800, 800, 0.03, 'square', 0.1),
  empty: () => blip(150, 150, 0.05, 'square', 0.15),
  wave: () => blip(220, 440, 0.4, 'sawtooth', 0.2),
  cleared: () => blip(440, 880, 0.3, 'triangle', 0.25),
  boss: () => blip(80, 40, 1.5, 'sawtooth', 0.35),
  battack: e => e.atk === 'bomb' ? blip(200, 500, 0.2, 'triangle', 0.2) : blip(400, 100, 0.25, 'square', 0.15),
  // telegraphs: bright "ding" = parryable, low horn = hazard (move!), click = shots incoming
  tele: e => e.atk === 'lunge' ? (blip(2200, 2200, 0.12, 'sine', 0.3), blip(3300, 3300, 0.2, 'sine', 0.15))
    : ['floor', 'shock', 'storm', 'sweep'].includes(e.atk) ? (blip(110, 100, 0.7, 'sawtooth', 0.3), blip(116, 104, 0.7, 'sawtooth', 0.2))
    : blip(900, 1400, 0.1, 'square', 0.12),
  lunge: () => blip(400, 120, 0.25, '', 0.4, true),
  // (sweep uses the same 'lunge' event)
  hazard: e => e.atk !== 'shock' ? blip(800, 100, 1.2, '', 0.4, true) : blip(60, 60, 1.2, 'sawtooth', 0.25),
  cutin: () => { blip(400, 5000, 0.16, '', 0.5, true); blip(70, 50, 0.4, 'sawtooth', 0.35); },
  glint: () => { blip(3600, 3600, 0.25, 'sine', 0.25); blip(5400, 5400, 0.3, 'sine', 0.15); },
  execute: () => { blip(5000, 100, 0.6, '', 0.7, true); blip(90, 40, 0.9, 'sawtooth', 0.5); blip(180, 60, 0.9, 'square', 0.3); },
  clink: () => blip(2600, 2400, 0.04, 'square', 0.06),
  dodge: () => blip(900, 300, 0.1, '', 0.2, true),
  perfect: () => { blip(400, 1600, 0.25, 'sine', 0.3); blip(1200, 2400, 0.3, 'triangle', 0.2); },
  riposte: () => { blip(2000, 200, 0.3, '', 0.5, true); blip(220, 110, 0.3, 'square', 0.25); },
  parrytry: () => blip(1500, 600, 0.06, '', 0.15, true),
  parry: () => { blip(3000, 2500, 0.25, 'square', 0.3); blip(4500, 4000, 0.35, 'sine', 0.25); blip(6000, 1000, 0.15, '', 0.4, true); },
  stagger: () => { blip(150, 140, 1.4, 'triangle', 0.5); blip(301, 280, 1.4, 'sine', 0.3); },
  phase: () => { blip(60, 200, 1.5, 'sawtooth', 0.4); blip(1500, 50, 1.5, '', 0.4, true); },
  bombhit: e => blip(500 + (8 - e.left) * 120, 500 + (8 - e.left) * 120, 0.05, 'square', 0.12),
  defuse: () => [880, 1320].forEach((f, i) => setTimeout(() => blip(f, f, 0.12, 'triangle', 0.25), i * 60)),
  boom: () => { blip(3000, 200, 0.5, '', 0.5, true); blip(150, 60, 0.6, 'sine', 0.4);
    for (let i = 0; i < 6; i++) setTimeout(() => blip(4000 + Math.random() * 3000, 800, 0.06, '', 0.15, true), 120 + i * 70); }, // crackle
  lifelost: () => blip(500, 60, 0.8, 'sawtooth', 0.35),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, f, 0.2, 'square', 0.15), i * 120)),
  lose: () => blip(300, 40, 1.2, 'sawtooth', 0.3)
};

// --- colour language (docs/art/README.md): gold = parry, magenta = danger, cyan = sent back. Nothing else uses them.
const GOLD = '#ffd23f', DANGER = '#ff2bd6', CYAN = '#3ff2ff', CRIMSON = '#d81b3c', PAPER = '#efe9dd', AMBER = '#ffb02e', EMBER = '#ff6a1a';

// --- visual feedback (render-only, never touches sim state)
let pops = [], trail = [], parts = [], shake = 0, flash = 0, wflash = 0, banner = { text: '', t: 0 }, hitstop = 0;
function burst(x, y, n, col, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 20 + Math.random() * 20, col }); } }
// One-time hints: the first time each rule shows up (tutorial wave), say what to do. Render-only.
const HINTS = [
  [e => e.t === 'tele' && e.atk === 'lunge', 'GOLD FLASH = PARRY IT  ·  [{parry}] just as it hits'],
  [e => e.t === 'clink', 'ARMORED: bullets bounce off. Parry its lunges.'],
  [e => e.t === 'parry' && !e.deflect, 'Parries fill its POSTURE bar. Fill it to STAGGER it.'],
  [e => e.t === 'stagger', 'STAGGERED! Get close, [{execute}] EXECUTE before the circle empties'],
  [e => e.t === 'eshot' && e.orb, 'GOLD ORBS: parry [{parry}] to send them back'],
  [e => e.t === 'battack' && e.atk === 'bomb', 'BOMB: shoot it before its ring runs out, or it bursts into homing orbs'],
  [e => e.t === 'tele' && e.atk === 'sweep', 'MAGENTA = CAN\'T PARRY: jump it, or DODGE [{dodge}] the instant it hits'],
  [e => e.t === 'tele' && ['floor', 'shock', 'storm'].includes(e.atk), 'MAGENTA ZONE: get off it before it ignites'],
  [e => e.t === 'perfect', 'PERFECT DODGE: your next shot is a riposte'],
  [e => e.t === 'lifelost', 'Any hit costs a life and restarts the wave. Keep your guns from its start.']
];
const shown = new Set(); let hintBox = { text: '', t: 0 };
function hint(e) { // while a floor sign is teaching, it replaces these pop-up hints (losing a life is always explained)
  HINTS.forEach(([match, text], i) => { if (!shown.has(i) && match(e)) { shown.add(i); if (!lesson() || e.t === 'lifelost') hintBox = { text: text.replace(/\{(\w+)\}/g, (_, a) => keyLabel(a)), t: 330 }; } });
}
// --- tutorial: instructions stuck to the floor. Basics gate wave 1; each new enemy's sign stays until one of that type dies.
let tut = 0; const learned = new Set();
const LESSONS = {
  grunt: () => ({ title: 'CINDERLING', text: `Touching it costs a life. Aim and shoot it with [${keyLabel('shoot')}].`, col: EMBER }),
  gunner: () => ({ title: 'SPITTER', text: `Its embers can't be parried. Dodge with [${keyLabel('dodge')}] and shoot it.`, col: EMBER }),
  orber: () => ({ title: 'LANTERN', text: `Gold orbs can be sent back. Press [${keyLabel('parry')}] as one reaches you.`, col: GOLD }),
  bomber: () => ({ title: 'KILN', text: 'Shoot its bomb before the ring runs out, then shoot the Kiln.', col: EMBER }),
  brute: e => e.state === 'stagger' ? { title: 'STAGGERED', text: `Get close and press [${keyLabel('execute')}] to finish it.`, col: CRIMSON }
    : e.state === 'tele' ? { title: 'GOLD FLASH', text: `Press [${keyLabel('parry')}] just as it hits you.`, col: GOLD }
    : e.posture > 0 ? { title: 'ANVIL', text: 'Good. Parry again to fill its posture bar.', col: GOLD }
    : { title: 'ANVIL', text: `Bullets bounce off. Wait for the gold flash, then parry with [${keyLabel('parry')}].`, col: GOLD },
  reaver: e => e.state === 'stagger' ? { title: 'STAGGERED', text: `Get close and press [${keyLabel('execute')}] to finish it.`, col: CRIMSON }
    : e.state === 'tele' && e.atk === 'sweep' ? { title: "MAGENTA: CAN'T PARRY", text: `Jump over it, or dodge with [${keyLabel('dodge')}] as it hits.`, col: DANGER }
    : e.state === 'tele' ? { title: 'GOLD FLASH', text: `Parry with [${keyLabel('parry')}] just as it hits.`, col: GOLD }
    : { title: 'BRAND', text: 'Parry gold attacks, avoid magenta, and fill its posture bar.', col: GOLD }
};
function basicsLesson() {
  if (tut === 0) return { title: 'MOVE', text: `Run with [${keyLabel('left')}] and [${keyLabel('right')}].`, col: PAPER };
  if (tut === 1) return { title: 'JUMP', text: `Press [${keyLabel('jump')}] twice to double jump.`, col: PAPER };
  return { title: 'SHOOT', text: `Aim with the mouse and fire with [${keyLabel('shoot')}].`, col: PAPER };
}
function lesson() {
  if (!cfg.tutorial || !s) return null;
  if (s.wave === 0 && tut < 3) return basicsLesson();
  const e = s.enemies.find(x => LESSONS[x.type] && !learned.has(x.type));
  return e ? LESSONS[e.type](e) : null;
}
function stepTutorial() {
  const p = s.players[0];
  s.hold = cfg.tutorial && s.wave === 0 && tut < 3;
  if (tut === 0 && Math.abs(p.vx) > 2) tut = 1;
}
function drawFloorSign() { // sticks to the floor, and stays on screen if the camera climbs above it
  const L = lesson();
  if (!L) return;
  ctx.font = FONT_B(15); const tw = ctx.measureText(L.text).width;
  ctx.font = FONT_D(14); const w = Math.max(tw, ctx.measureText(L.title).width) + 44, ht = 46;
  const x = (KB.W - w) / 2, y = Math.min(KB.H - ht - 6, toScreen(0, KB.FLOOR_Y)[1] + 10);
  plate(x, y, w, ht); ctx.fillStyle = L.col; ctx.fillRect(x + 2, y + 6, 4, ht - 12);
  ctx.font = FONT_D(14); ctx.fillText(L.title, x + 20, y + 18);
  ctx.font = FONT_B(15); ctx.fillStyle = PAPER; ctx.fillText(L.text, x + 20, y + 37);
}
// one-shot body animations (frame lengths in ticks), started from sim events
const ONE = { parry_hit: [6, 12], perfect: [10], execute: [6, 6, 8, 10], hurt: [6, 20], respawn: [10, 10], flip: [4, 4, 5], land: [6] };
let one = null, rt = 0, lastShot = -99, winAt = 0, wasGround = true, wasVy = 0;
const play = name => { one = { name, at: rt }; };
function animEvent(e) {
  if (e.t === 'shot') { lastShot = rt; one = null; if (tut === 2) { tut = 3; s.hold = false; s.timer = Math.min(s.timer, 75); } }
  if (e.t === 'hit') { const m = s.enemies.find(x => x.x + x.w / 2 === e.x && x.y + x.h / 2 === e.y); if (m) mobHit.set(m, rt); }
  if (e.t === 'die') learned.add(e.kind);
  if (e.t === 'die' && e.kind === 'boss') bossDeath = { x: e.x, feet: e.y + 45, at: rt, ...bossLast };
  if (e.t === 'dodge' || e.t === 'parrytry') one = null;
  if (e.t === 'parry') play('parry_hit');
  if (e.t === 'perfect') play('perfect');
  if (e.t === 'execute') { play('execute'); if (cutin) one.at -= ONE.execute[0]; } // the cut-in was the wind-up
  if (e.t === 'hurt') play('hurt');
  if (e.t === 'jump' && s.players[0].jumps === 0) { play('flip'); if (tut === 1) tut = 2; }
  if (e.t === 'win') winAt = rt;
}
function react(e) {
  animEvent(e);
  fxEvent(e);
  (SFX[e.t] || (() => {}))(e);
  if (e.t === 'shot') shake = Math.max(shake, e.gun === 'shotgun' ? 6 : 2);
  if (e.t === 'die') { if (e.kind === 'boss') { burst(e.x, e.y, 60, INK, 9); burst(e.x, e.y, 60, EMBER, 9); } else { burst(e.x, e.y, 22, '#2b2326', 5); burst(e.x, e.y, 14, EMBER, 5); burst(e.x, e.y, 6, AMBER, 3); } shake = e.kind === 'boss' ? 25 : 8; hitstop = Math.max(hitstop, e.kind === 'boss' ? 30 : 3); }
  if (e.t === 'hurt') { flash = 14; shake = 14; hitstop = 20; burst(e.x, e.y, 18, INK, 6); burst(e.x, e.y, 12, CRIMSON, 6); }
  if (e.t === 'lifelost') banner = { text: (e.boss ? 'PHASE RESTART' : 'WAVE RESTART') + ' · ' + e.left + ' left', t: 90 };
  if (e.t === 'parry') { shake = 12; hitstop = 10; burst(e.x, e.y, 14, GOLD, 7); burst(e.x, e.y, 8, PAPER, 5); }
  if (e.t === 'stagger') { banner = { text: 'STAGGER', t: 70 }; shake = 18; hitstop = 14; burst(e.x, e.y, 20, PAPER, 6); if (s.enemies.some(b => b.type === 'boss' && b.state === 'stagger')) startBand(3, 34); }
