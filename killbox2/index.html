  .panel h3 { margin: .85em 0 .25em; font-size: .78em; letter-spacing: .12em; text-transform: uppercase; color: #ff9a55; }

  .tabs { display: flex; gap: .35em; margin-bottom: .5em; } .tabs .active { border-color: #ff6a1a !important; background: #2b2326 !important; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: .5em; scrollbar-color: #4a3a36 #17151c; scrollbar-width: thin; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .22em 0; font-size: .92em; }

<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let RS = 1; // render scale: draw at display resolution (max 2x = 1080p) so inked sprites stay sharp
function fit() { const k = Math.min(innerWidth / KB.W, innerHeight / KB.H); RS = Math.max(1, Math.min(cfg.quality === 'high' ? 2 : 1, k * (devicePixelRatio || 1))); cv.width = Math.round(KB.W * RS); cv.height = Math.round(KB.H * RS); cv.style.width = KB.W * k + 'px'; cv.style.height = KB.H * k + 'px'; cv.style.marginTop = (innerHeight - KB.H * k) / 2 + 'px'; uiFit(k, (innerHeight - KB.H * k) / 2, (innerWidth - KB.W * k) / 2); dirty = true; }
addEventListener('resize', fit); fit();

// --- input (sampled once per tick into a plain object: that object is what goes over the wire later)
const keys = {}, mouse = { x: 480, y: 270 };
addEventListener('keydown', e => { audio(); if (uiKey(e)) return; keys[e.code] = true; });
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * KB.W / r.width; mouse.y = (e.clientY - r.top) * KB.H / r.height; });
cv.addEventListener('mousedown', e => { audio(); if (mode === 'play') keys['Mouse' + e.button] = true; });
addEventListener('mouseup', e => { keys['Mouse' + e.button] = false; });
addEventListener('contextmenu', e => e.preventDefault()); // whole page, including the bars around the canvas
let wheel = false; cv.addEventListener('wheel', e => { if (mode === 'play') wheel = true; e.preventDefault(); }, { passive: false });
// --- camera: close follow (metroidvania framing), leans toward the aim, wider in the boss fight, clamped to the arena.
const ZOOM = 1.75, ZOOM_BOSS = 1.4, LOOK = 70;
const cam = { x: KB.W / 2, y: KB.H / 2, z: ZOOM };
const toWorldX = sx => cam.x + (sx - KB.W / 2) / cam.z, toWorldY = sy => cam.y + (sy - KB.H / 2) / cam.z;
const toScreen = (x, y) => [(x - cam.x) * cam.z + KB.W / 2, (y - cam.y) * cam.z + KB.H / 2];
function updateCam() {
  const p = s.players[0], boss = s.enemies.some(e => e.type === 'boss');
  cam.z += ((boss ? ZOOM_BOSS : ZOOM) - cam.z) * 0.05;
  const tx = p.x + p.w / 2 + Math.cos(p.aim) * LOOK, ty = p.y + p.h / 2 - 30 + Math.sin(p.aim) * LOOK * 0.6;
  cam.x += (tx - cam.x) * 0.12; cam.y += (ty - cam.y) * 0.12;
  const hw = KB.W / 2 / cam.z, hh = KB.H / 2 / cam.z;
  cam.x = Math.max(hw, Math.min(KB.W - hw, cam.x)); cam.y = Math.max(hh, Math.min(KB.H - hh, cam.y));
}
// arrows use the colour language: an enemy winding up shows how to answer it
function arrowCol(e) { return e.type === 'gunner' && (e.beam > 0 || e.cd <= KB.LASER.aim) ? DANGER : e.state === 'tele' && e.atk !== 'bomb' ? (e.atk === 'lunge' || e.atk === 'burst' ? GOLD : DANGER) : PAPER; }
function offscreenArrows() { // threats outside the view get an arrow on the screen edge
  const M = 22, things = [...s.enemies.map(e => [e.x + e.w / 2, e.y + e.h / 2, arrowCol(e)]), ...s.bombs.map(k => [k.x + 10, k.y + 10, EMBER]), ...s.bullets.filter(b => b.team === 'e').map(b => [b.x, b.y, b.refl ? GOLD : DANGER, 0.55])];
  for (const [x, y, col, size = 1] of things) {
    const [sx, sy] = toScreen(x, y);
    if (sx > 0 && sx < KB.W && sy > 0 && sy < KB.H) continue;
    const ex = Math.max(M, Math.min(KB.W - M, sx)), ey = Math.max(M, Math.min(KB.H - M, sy)), a = Math.atan2(sy - ey, sx - ex);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.scale(size, size);
    ctx.beginPath(); for (const [u, v] of [[15, 0], [-9, -10], [-4, 0], [-9, 10]]) ctx.lineTo(u, v); ctx.closePath(); inked(col, 2); ctx.restore();
  }
}
function readInput(p) {
  const inp = { left: actionHeld('left'), right: actionHeld('right'), jump: actionHeld('jump'), down: actionHeld('down'),
    shoot: actionHeld('shoot'), parry: actionHeld('parry'), dodge: actionHeld('dodge'), swap: actionHeld('swap') || wheel, execute: actionHeld('execute'),
    aim: Math.atan2(toWorldY(mouse.y) - (p.y + KB.SHOULDER), toWorldX(mouse.x) - (p.x + p.w / 2)) };
  wheel = false; return inp;
}

// --- audio: tiny synth blips so every action has a sound
let ac = null;
let masterGain = null, musicGain = null;
function audio() { if (!ac) { ac = new AudioContext(); masterGain = ac.createGain(); masterGain.connect(ac.createDynamicsCompressor()).connect(ac.destination); musicGain = ac.createGain(); musicGain.connect(masterGain); applyVolume(); } if (ac.state === 'suspended') ac.resume(); }
function applyVolume() { if (!masterGain) return; masterGain.gain.value = cfg.muted ? 0 : (cfg.volume / 100) ** 1.6; musicGain.gain.value = (cfg.music / 100) ** 1.6; }
function blip(f0, f1, dur, type, vol, noise, delay = 0, out = masterGain) {
  if (!ac) return;
  const t = ac.currentTime + delay, g = ac.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); g.connect(out);
  let src;
  if (noise) {
    const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    src = ac.createBufferSource(); src.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    src.connect(f); f.connect(g);
  } else {
    src = ac.createOscillator(); src.type = type; src.frequency.setValueAtTime(f0, t); src.frequency.exponentialRampToValueAtTime(f1, t + dur); src.connect(g);
  }
  src.start(t); src.stop(t + dur);
}
// telegraph and release sounds per attack. Family = colour: clean bells are gold (parry), harsh low tones are magenta (move).
const bells = (...f) => f.forEach((x, i) => { blip(x, x, 0.22, 'sine', 0.28, false, i * 0.07); blip(x * 1.5, x * 1.5, 0.25, 'sine', 0.12, false, i * 0.07); });
const horn = (f, d) => { blip(f, f * 0.92, d, 'sawtooth', 0.26); blip(f * 1.06, f, d, 'sawtooth', 0.18); };
const TELE_SFX = {
  lunge: () => bells(2200),
  burst: () => bells(1400, 1760, 2100),
  sweep: () => { horn(150, 0.4); [0, 0.12, 0.24].forEach(d => blip(1600, 300, 0.11, '', 0.4, true, d)); },
  floor: () => { horn(65, 0.9); blip(250, 900, 0.9, '', 0.45, true); },
  shock: () => { for (let i = 0; i < 8; i++) blip(i % 2 ? 180 : 240, 180, 0.07, 'square', 0.16, false, i * 0.08); },
  storm: () => { horn(110, 0.7); blip(900, 300, 0.7, 'sawtooth', 0.12); },
  spray: () => { for (let i = 0; i < 5; i++) blip(700 + i * 60, 500, 0.05, 'sawtooth', 0.16, false, i * 0.06); },
  bomb: () => blip(250, 750, 0.35, 'triangle', 0.3),
  nova: () => { horn(55, 1.4); blip(220, 233, 1.4, 'sawtooth', 0.14); }
};
const ACT_SFX = {
  lunge: () => blip(400, 120, 0.25, '', 0.4, true),
  sweep: () => { blip(1400, 200, 0.5, '', 0.5, true); blip(90, 60, 0.4, 'sawtooth', 0.2); },
  burst: () => bells(1760, 1760),
  spray: () => blip(2400, 300, 0.35, '', 0.4, true),
  bomb: () => blip(200, 500, 0.2, 'triangle', 0.2),
  nova: () => { blip(6000, 80, 1, '', 0.7, true); blip(140, 35, 1.1, 'sawtooth', 0.45); },
  floor: () => blip(800, 100, 1.2, '', 0.45, true),
  shock: () => { blip(60, 60, 1.2, 'sawtooth', 0.25); for (let i = 0; i < 6; i++) blip(5000, 2000, 0.05, '', 0.25, true, i * 0.15); },
  storm: () => { blip(800, 100, 1.2, '', 0.4, true); blip(2400, 300, 0.4, '', 0.35, true); }
};
// wind-up and danger cues the sim has no event for; runs once per sim step
let sizzleAt = -99;
function cueStep() {
  const p = s.players[0];
  for (const e of s.enemies) {
    if (e.state === 'tele' && e.atk === 'nova' && (e.t === 45 || e.t === 30 || e.t === 15)) blip(440 + (45 - e.t) * 15, 440, 0.1, 'square', 0.28); // count-in: the hit is the fourth beat
    if (e.type === 'gunner' && e.cd === KB.LASER.aim) blip(180, 1400, KB.LASER.aim / 60, 'sawtooth', 0.14); // whine climbs to the shot
    if (e.type === 'gunner' && e.cd === KB.LASER.lock) blip(1800, 1800, 0.06, 'square', 0.22);
    if (e.type === 'orber' && e.cd === 24) bells(1100, 1400);
    if (e.type === 'bomber' && e.cd === 24) blip(200, 500, 0.35, 'triangle', 0.2);
    if (e.type === 'grunt' && rt - sizzleAt > 22 && Math.hypot(e.x + e.w / 2 - p.x - p.w / 2, e.y + e.h / 2 - p.y - p.h / 2) < 80) { sizzleAt = rt; blip(3500, 1800, 0.12, '', 0.16, true); }
  }
}
// --- music: a small step sequencer that follows the fight (calm, wave, boss phase 1-3)
// shortcut: synthesized placeholder score, replace with a recorded track once one is picked
const RIFF = [0, -1, 0, 12, 0, -1, 3, -1, 0, -1, 0, 10, 0, 7, 3, 2], ROOTS = [0, 0, -4, -2], LEAD = [0, 7, 12, 15, 14, 12, 7, 3]; // -1 in RIFF = rest
const hz = n => 41.2 * 2 ** (n / 12); // semitones above low E
let mStep = 0, mNext = 0;
function stepMusic() {
  if (!ac || ac.state !== 'running') return;
  const boss = s.enemies.find(e => e.type === 'boss'), level = mode !== 'play' || s.phase === 'break' || s.phase === 'clear' || s.phase === 'dead' ? 0 : boss ? 2 + boss.ph : 1;
  const len = 60 / (level > 1 ? 138 + level * 5 : 124) / 4;
  if (mNext < ac.currentTime) mNext = ac.currentTime + 0.05; // first note, or back from a hidden tab
  while (mNext < ac.currentTime + 0.15) {
    const i = mStep % 16, bar = (mStep >> 4) % 4, root = ROOTS[bar], d = mNext - ac.currentTime, M = musicGain;
    if (i === 0) { blip(hz(root + 24), hz(root + 24), len * 15, 'triangle', 0.1, false, d, M); blip(hz(root + 31), hz(root + 31), len * 15, 'triangle', 0.07, false, d, M); }
    if (level === 0) { if (i === 0 || i === 10) blip(hz(root), hz(root), len * 6, 'triangle', 0.3, false, d, M); }
    else {
      if (RIFF[i] >= 0) blip(hz(root + RIFF[i]), hz(root + RIFF[i]), len * 1.6, 'sawtooth', 0.2, false, d, M);
      if (i % 4 === 0 || (level > 2 && i % 4 === 2)) blip(130, 40, 0.14, 'sine', 0.6, false, d, M);
      if (i === 4 || i === 12) blip(4500, 900, 0.14, '', 0.3, true, d, M);
      if (i % 2 === 0 || level > 3) blip(9000, 6000, 0.03, '', 0.1, true, d, M);
      if (level > 1 && i % 2 === 0) blip(hz(root + 36 + LEAD[(i / 2 + bar * 3) % 8]), hz(root + 36 + LEAD[(i / 2 + bar * 3) % 8]), len * 1.8, 'square', level > 2 ? 0.07 : 0.045, false, d, M);
    }
    mStep++; mNext += len;
  }
}
const SFX = {
  shot: e => e.gun === 'shotgun' ? blip(3000, 200, 0.25, '', 0.5, true) : e.gun === 'smg' ? blip(2500, 400, 0.06, '', 0.25, true) : blip(1800, 300, 0.1, '', 0.35, true),
  eshot: () => blip(1300, 1000, 0.18, 'sine', 0.2),
  laser: () => { blip(2400, 180, 0.28, 'sawtooth', 0.28); blip(6000, 500, 0.22, '', 0.4, true); },
  hit: e => blip(e.kind === 'boss' ? 180 : 400, 80, 0.06, 'square', 0.12),
  die: e => blip(1200, 60, e.kind === 'boss' ? 1.2 : 0.3, '', 0.5, true),
  hurt: () => blip(200, 50, 0.2, 'sawtooth', 0.3),
  land: () => blip(220, 60, 0.12, '', 0.35, true),
  spawn: () => { blip(160, 900, 0.22, 'sawtooth', 0.12); blip(700, 4000, 0.3, '', 0.25, true); }, // tears open
  jump: () => blip(300, 600, 0.08, 'triangle', 0.15),
  pickup: e => e.kind === 'life' ? [660, 880, 1320].forEach((f, i) => blip(f, f, 0.3, 'triangle', 0.22, false, i * 0.09)) // chime
    : e.kind === 'ammo' ? [0, 0.05, 0.11].forEach(d => blip(3800, 2600, 0.04, 'square', 0.09, false, d)) // rattle
    : [0, 0.13].forEach(d => { blip(2600, 500, 0.07, '', 0.4, true, d); blip(320, 180, 0.07, 'square', 0.14, false, d); }), // rack
  swap: () => blip(800, 800, 0.03, 'square', 0.1),
  empty: () => blip(150, 150, 0.05, 'square', 0.15),
  wave: () => blip(220, 440, 0.4, 'sawtooth', 0.2),
  cleared: () => blip(440, 880, 0.3, 'triangle', 0.25),
  boss: () => blip(80, 40, 1.5, 'sawtooth', 0.35),
  battack: e => (ACT_SFX[e.atk] || (() => {}))(),
  tele: e => TELE_SFX[e.atk](),
  lunge: e => ACT_SFX[e.atk](), // lunge and sweep
  hazard: e => ACT_SFX[e.atk](),
  cutin: () => { blip(400, 5000, 0.16, '', 0.5, true); blip(70, 50, 0.4, 'sawtooth', 0.35); },
  glint: () => { blip(3600, 3600, 0.25, 'sine', 0.25); blip(5400, 5400, 0.3, 'sine', 0.15); },
  execute: () => { blip(5000, 100, 0.6, '', 0.7, true); blip(90, 40, 0.9, 'sawtooth', 0.5); blip(180, 60, 0.9, 'square', 0.3); },
  clink: () => blip(2600, 2400, 0.04, 'square', 0.06),
  dodge: () => blip(900, 300, 0.1, '', 0.2, true),
  perfect: () => { blip(400, 1600, 0.25, 'sine', 0.3); blip(1200, 2400, 0.3, 'triangle', 0.2); },
  riposte: () => { blip(2000, 200, 0.3, '', 0.5, true); blip(220, 110, 0.3, 'square', 0.25); },
  parrytry: () => blip(1500, 600, 0.06, '', 0.15, true),
  parry: () => { blip(3000, 2500, 0.25, 'square', 0.3); blip(4500, 4000, 0.35, 'sine', 0.25); blip(6000, 1000, 0.15, '', 0.4, true); },
  stagger: () => { blip(150, 140, 1.4, 'triangle', 0.5); blip(301, 280, 1.4, 'sine', 0.3); },
  phase: () => { blip(60, 200, 1.5, 'sawtooth', 0.4); blip(1500, 50, 1.5, '', 0.4, true); },
  bombhit: e => blip(500 + (8 - e.left) * 120, 500 + (8 - e.left) * 120, 0.05, 'square', 0.12),
  defuse: () => [880, 1320].forEach((f, i) => setTimeout(() => blip(f, f, 0.12, 'triangle', 0.25), i * 60)),
  boom: () => { blip(3000, 200, 0.5, '', 0.5, true); blip(150, 60, 0.6, 'sine', 0.4);
    for (let i = 0; i < 6; i++) setTimeout(() => blip(4000 + Math.random() * 3000, 800, 0.06, '', 0.15, true), 120 + i * 70); }, // crackle
  lifelost: () => blip(500, 60, 0.8, 'sawtooth', 0.35),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, f, 0.2, 'square', 0.15), i * 120)),
  lose: () => blip(300, 40, 1.2, 'sawtooth', 0.3)
};

// --- colour language (docs/art/README.md): gold = parry, magenta = danger, cyan = sent back. Nothing else uses them.
const GOLD = '#ffd23f', DANGER = '#ff2bd6', CYAN = '#3ff2ff', CRIMSON = '#d81b3c', PAPER = '#efe9dd', AMBER = '#ffb02e', EMBER = '#ff6a1a';

// --- visual feedback (render-only, never touches sim state)
const CAUSE = { grunt: 'CINDERLING', laser: 'SPITTER LASER', orb: 'GOLD ORB', lunge: 'LUNGE', sweep: 'SWEEP' }; // waves only: the boss is for the player to work out
let pops = [], trail = [], parts = [], shake = 0, flash = 0, wflash = 0, banner = { text: '', t: 0 }, hitstop = 0;
function burst(x, y, n, col, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 20 + Math.random() * 20, col }); } }
// --- tutorial: instructions stuck to the floor. Basics gate wave 1; each new enemy's sign stays until one of that type dies.
let tut = 0; const learned = new Set();
const signKey = a => `[${codeName(cfg.binds[a].find(Boolean))}]`; // the main binding only, drawn as a keycap
const LESSONS = { // one short line each, so the sign never resizes mid-fight
  grunt: () => ['CINDERLING', `${signKey('shoot')} before it touches you`],
  gunner: () => ['SPITTER', `Sidestep the line or dash ${signKey('dodge')}`],
  orber: () => ['LANTERN', `Parry the orb back ${signKey('parry')}`],
  bomber: () => ['KILN', `Shoot the bomb ${signKey('shoot')}`],
  brute: e => ['ANVIL', e.state === 'stagger' ? `Get close ${signKey('execute')}` : `Parry gold ${signKey('parry')}`],
  reaver: e => ['BRAND', e.state === 'stagger' ? `Get close ${signKey('execute')}` : `Parry gold ${signKey('parry')}  Jump magenta`]
};
function basicsLesson() {
  if (tut === 0) return ['MOVE', `${signKey('left')} ${signKey('right')}`];
  if (tut === 1) return ['DOUBLE JUMP', `${signKey('jump')} twice`];
  return ['SHOOT', signKey('shoot')];
}
function lesson() {
  if (!cfg.tutorial || !s) return null;
  if (s.wave === 0 && tut < 3) return basicsLesson();
  const e = s.enemies.find(x => LESSONS[x.type] && !learned.has(x.type));
  return e ? LESSONS[e.type](e) : null;
}
function stepTutorial() {
  const p = s.players[0];
  s.hold = cfg.tutorial && s.wave === 0 && tut < 3;

  if (flash > 0) { ctx.fillStyle = `rgba(255,0,0,${(cfg.flashes ? 1 : 0.18) * flash / 30})`; ctx.fillRect(0, 0, KB.W, KB.H); flash--; }
  if (wflash > 0) { ctx.fillStyle = `rgba(255,255,255,${(cfg.flashes ? 1 : 0.12) * wflash / 14})`; ctx.fillRect(0, 0, KB.W, KB.H); wflash--; }
  drawHud(boss, pulse);
  if (banner.t > 0) { banner.t--; ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, banner.t / 12); const bx = bandOn() ? 225 : KB.W / 2, by = bandOn() ? 268 : 146; label(banner.text, bx, by, FONT_D(52), PAPER, 7); ctx.fillStyle = CRIMSON; ctx.fillRect(bx - 90, by + 10, 180, 4); if (banner.sub) label(banner.sub, bx, by + 40, FONT_D(24), DANGER, 5); ctx.globalAlpha = 1; ctx.textAlign = 'left'; }
  drawFloorSign();
  if (mode === 'play') drawCrosshair();
  if (location.hash === '#boss' && s.phase !== 'boss' && !s.devBoss && s.tick >= 1) { s.devBoss = true; s.enemies = []; KB.spawnBoss(s); } // dev shortcut: index.html#boss
}
if (location.hash === '#boss') startGame(); else show('menu');
